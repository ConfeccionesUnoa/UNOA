worker_processes 1;
 
events { worker_connections 1024; }
 
http {
    include    /etc/nginx/mime.types;
    sendfile on;
 
    # ══════════════════════════════════════════
    # Rate limiting: max 15 req/s por IP
    # Un usuario normal nunca supera esto
    # Un bot que hace 100 req/s queda cortado
    # ══════════════════════════════════════════
    limit_req_zone $binary_remote_addr zone=general:10m rate=15r/s;
    limit_req_status 444;
 
    upstream unoa-backend {
        server unoa-backend:8000;
    }
 
    server {
        listen 80;
        server_name app.confeccionesunoa.com;
 
        # Aplicar rate limit global con burst para cargas normales de SPA
        # burst=30 permite que el navegador cargue los assets iniciales sin problema
        limit_req zone=general burst=30 nodelay;
 
        # ══════════════════════════════════════════
        # 🛡️ BLOQUEOS DE SEGURIDAD
        # ══════════════════════════════════════════
 
        # Archivos y directorios ocultos (.env, .git, .cline, .htaccess, etc.)
        location ~ /\. {
            return 444;
        }
 
        # Rutas WordPress
        location ~* /(wp-admin|wp-login|wp-login\.php|wp-includes|wp-content|wp-json|wordpress|xmlrpc\.php|wlwmanifest\.xml) {
            return 444;
        }
 
        # Scripts de servidor que nunca deberían existir en un frontend
        location ~* \.(php|asp|aspx|jsp|cgi|sh|pl|rb|plist)$ {
            return 444;
        }
 
        # Archivos de configuración y credenciales conocidos
        location ~* /(firebase[^/]*\.(json|js)|secrets\.(json|js)|credentials\.json|serviceaccount\.json|service-account\.json|google-services\.json|GoogleService-Info\.plist|api-?keys?\.(json|js)|private\.(json|js)|keys\.(json|js)|configuration\.json|env\.json|settings\.json|config\.json|constants\.json)$ {
            return 444;
        }
 
        # Parámetros de debug PHP
        if ($query_string ~* "(XDEBUG_SESSION|phpstorm|eval\(|base64_encode)") {
            return 444;
        }
 
        # ══════════════════════════════════════════
        # ✅ RUTAS LEGÍTIMAS
        # ══════════════════════════════════════════
 
        location /api {
            proxy_pass         http://unoa-backend;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }
 
        location /media/ {
            alias /media/;
        }
 
        location /public/ {
            alias /public/;
        }
 
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}