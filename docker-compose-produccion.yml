version: '3.7'
services:
  unoa-frontend:
    build:
      context: ./frontend-nuevo/
      target: 'production-stage'
    image: unoa-frontend
    container_name: unoa-frontend
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf
      - ./media/:/media/
      - ./public/:/public/
    depends_on:
      - unoa-backend
    ports:
      - 80:80
  unoa-backend:
    build:
      dockerfile: Dockerfile
      context: backend/
      args:
        requirements: requirements/produccion.txt
    image: unoa-backend
    restart: unless-stopped
    container_name: unoa-backend
    command: sh -c 'python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --worker-class=gevent --worker-connections=1000 --workers=1 --log-level=DEBUG config.wsgi:application --bind 0.0.0.0:8000'
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.produccion
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
    volumes:
      - ./media/:/media/
      - ./public/:/public/
